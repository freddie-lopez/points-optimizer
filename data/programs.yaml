    - name: "Accor Live Limitless"
      note: "Not a Chase UR partner. Relevant to the Novotel Madrid leg: cash only."
    - name: "NH Rewards / Minor DISCOVERY"
      note: "Not a Chase UR partner. Relevant to the NH Amsterdam leg: cash only."
