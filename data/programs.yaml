  World of Hyatt:
    name: "World of Hyatt"
    currency: "points"
    category: "hotel"
    aliases: ["Hyatt", "WoH", "hyatt"]
    # Card-dependent transfer ratio. See ratios.csv:
    #   Chase Sapphire Reserve        -> 1:1 always
    #   Chase Sapphire Preferred      -> 1:1 through 2026-09-30, then 4:3
    #   Chase Ink Business Preferred  -> 1:1 through 2026-09-30, then 4:3
    card_dependent: true
    award_rules:
      fifth_night_free: false
      peak_off_peak_calendar: false
      points_stay_tax_free: false

# ---------------------------------------------------------------------
# The Avios family: one currency, THREE DIFFERENT AWARD CHARTS.
#
# British Airways Executive Club, Club Iberia Plus and Aer Lingus AerClub all
# spend Avios and Avios can be moved between them, but each prices awards from
# its own chart and each levies its own carrier surcharge. The BA price for a
# flight is NOT the Iberia price for the same flight, and the tool must never
# substitute one for the other. This is the mechanism behind v1's headline
# capability - same balance, same aeroplane, wildly different cash - and also the
# most tempting place to invent a number.
# ---------------------------------------------------------------------
avios_family:
  members:
    - British Airways Executive Club
    - Club Iberia Plus
    - Aer Lingus AerClub
  shared_currency: true
  shared_award_chart: false
  note: >
    Prices must be supplied per program. Never reuse one member's award price for
    another. src/alternatives.py enforces this.

# ---------------------------------------------------------------------
# CAVEAT on `bookable_carriers`.
#
# These lists are derived from ALLIANCE MEMBERSHIP plus each program's own metal,
# plus the Avios family cross-booking relationship. Alliance membership is stable
# and public; a specific program-to-carrier award partnership is NOT the same
# thing, and a few of the pairs below will be wrong.
#
# That is tolerable ONLY because of how the list is used: alternatives.py emits
# every alliance-derived alternative as an UNPRICED counterfactual carrying a
# break-even points figure and the label "partnership assumed - verify". No
# alternative built from this list is ever scored, totalled, or presented as a
# confirmed price. If that ever changes, this list must be replaced with a
# verified partnership matrix first.
#
# NOT verified against a live source: the v1 build environment had no network.
# ---------------------------------------------------------------------
bookable_carriers_provenance:
  method: "alliance membership + own metal + Avios family"
  verified: false
  verified_on: null
  usage_constraint: "unpriced counterfactuals only; never scored"

# ---------------------------------------------------------------------
# Non-partners explicitly recorded so they are never silently re-added.
# ---------------------------------------------------------------------
