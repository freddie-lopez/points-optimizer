  # ---------------------------------------------------------------------
  # Hotel partners
  # ---------------------------------------------------------------------
  # AWARD RULES (fifth_night_free, peak_off_peak_calendar, points_stay_tax_free)
  # ALL DEFAULT TO OFF. Enabling one requires `source` and `verified_on`, and the
  # hotel-rule validator test fails a rule that is enabled without them. Shipping
  # them off is capability without invention: a wrongly-enabled fifth-night-free
  # silently makes every 5-night stay 20% cheaper than it is.
  IHG One Rewards:
    name: "IHG One Rewards"
    currency: "points"
    category: "hotel"
    aliases: ["IHG", "One Rewards", "ihg"]
    award_rules:
      fifth_night_free: false
      peak_off_peak_calendar: false
      points_stay_tax_free: false

  Marriott Bonvoy:
