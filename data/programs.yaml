    own_metal: ["AC"]
    alliance: "star"
    blanket_no_yq: true
    blanket_no_yq_note: >
      Aeroplan levies no carrier-imposed surcharge on PARTNER awards. Asserted
      for partner awards only - verify before extending to AC's own metal.
    bookable_carriers: ["AC", "UA", "LH", "OS", "SN", "LX", "SQ", "NH", "TK", "SK", "TP", "A3", "ET", "AI", "OZ", "CA", "BR", "NZ", "ZH", "MS", "SA", "AV", "CM", "JU"]

  Air France-KLM Flying Blue:
