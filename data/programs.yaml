# Program metadata, aliases, and partner lists.
#
# TRANSFER-RATIO SCOPE: Chase Ultimate Rewards (UR) only, verified 2026-09-07.
#
# v1 declares MR / TY / C1 / Bilt as KNOWN ISSUER CURRENCIES so a wallet can name
# them and the multi-currency machinery can be exercised. Declaring a currency is
# NOT a claim about its transfer partners: `data/ratios.csv` contains no verified
# rows for any of them, so today they fund nothing. Adding rows is a research
# task that could not be done from the build sandbox (no network egress at all),
# and the standard set in v0 - a partner that cannot be verified is omitted, not
# guessed - is not being lowered to fill the table.
#
# `aliases` are used by RatioManager.normalize_program() so that short names
# ("United", "Hyatt") and API-style codes ("united", "virginatlantic") resolve to
# the canonical program name used in ratios.csv.
#
# `blanket_no_yq: true` marks a program with a STRUCTURAL policy of levying no
# carrier-imposed surcharge. It is the only thing that licenses a `carrier=*`
# wildcard row in data/surcharges.csv; the surcharge-table validator rejects a
# wildcard row for any program without it.
#
# `bookable_carriers` is what src/alternatives.py consumes: which metal a program
# can ticket. See the caveat block at the bottom of this file - this list is an
# ALLIANCE-DERIVED APPROXIMATION, not a verified partnership matrix, and every
# alternative built from it is emitted unpriced and marked as assumed.

programs:
  UR:
    name: "Chase Ultimate Rewards"
    currency: "points"
    category: "issuer_currency"
    transfer_increment: 1000
    aliases: ["Chase UR", "Ultimate Rewards", "Chase Ultimate Rewards", "ur"]
    partners:
      # Airlines - all 1:1, no card dependency
      - Aer Lingus AerClub
      - Air Canada Aeroplan
      - Air France-KLM Flying Blue
      - British Airways Executive Club
      - Club Iberia Plus
      - JetBlue TrueBlue
      - Singapore Airlines KrisFlyer
      - Southwest Rapid Rewards
      - United MileagePlus
      - Virgin Atlantic Flying Club
      # Hotels
      - IHG One Rewards
      - Marriott Bonvoy
      - Wyndham Rewards
      - World of Hyatt

  # ---------------------------------------------------------------------
  # Other issuer currencies.
  #
  # DECLARED SO A WALLET CAN NAME THEM. There are no verified transfer rows for
  # any of these in ratios.csv, so each currently funds nothing. That is a data
  # gap, honestly recorded, not a code limitation.
  # ---------------------------------------------------------------------
  MR:
    name: "American Express Membership Rewards"
    currency: "points"
    category: "issuer_currency"
    transfer_increment: 1000
    aliases: ["Amex MR", "Membership Rewards", "American Express Membership Rewards", "mr", "amex"]
    partners_verified: false
    partners_note: >
      No verified partner rows. Amex MR's partner list, ratios and transfer
      increments were not verifiable from the v1 build environment, which has no
      network egress. Omitted rather than guessed.

  TY:
    name: "Citi ThankYou Points"
    currency: "points"
    category: "issuer_currency"
    transfer_increment: 1000
    aliases: ["Citi TY", "ThankYou", "ThankYou Points", "Citi ThankYou Points", "ty", "citi"]
    partners_verified: false
    partners_note: "No verified partner rows. See MR."

  C1:
    name: "Capital One Miles"
    currency: "miles"
    category: "issuer_currency"
    transfer_increment: 1000
    aliases: ["Capital One", "CapitalOne", "Capital One Miles", "c1", "capone"]
    partners_verified: false
    partners_note: "No verified partner rows. See MR."

  Bilt:
    name: "Bilt Rewards"
    currency: "points"
    category: "issuer_currency"
    transfer_increment: 1000
    aliases: ["Bilt Rewards", "bilt"]
    partners_verified: false
    partners_note: "No verified partner rows. See MR."

  # ---------------------------------------------------------------------
  # Airline partners
  # ---------------------------------------------------------------------
  Aer Lingus AerClub:
    name: "Aer Lingus AerClub"
    currency: "avios"
    category: "airline"
    aliases: ["Aer Lingus", "AerClub", "EI", "aerlingus"]
    avios_family: true
    own_metal: ["EI"]
    alliance: null
    bookable_carriers: ["EI", "BA", "IB"]

  Air Canada Aeroplan:
